<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#p2Bg)" rx="16" />

  <!-- RouterOS / WinBox Style Window -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="25" y="25" width="550" height="38" rx="12" fill="#0f172a" />
  <circle cx="45" cy="44" r="6" fill="#ef4444" />
  <circle cx="63" cy="44" r="6" fill="#f59e0b" />
  <circle cx="81" cy="44" r="6" fill="#10b981" />
  <text x="300" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">MikroTik RouterOS v7 - WinBox Interface [Tristan Hudi Network Lab]</text>

  <!-- Left Sidebar (WinBox Menu) -->
  <rect x="40" y="75" width="110" height="245" rx="6" fill="#0f172a" />
  <rect x="48" y="88" width="94" height="22" rx="4" fill="#2563eb" />
  <text x="58" y="103" fill="#ffffff" font-family="monospace" font-size="11">Interfaces</text>
  <rect x="48" y="118" width="94" height="20" rx="4" fill="transparent" />
  <text x="58" y="132" fill="#94a3b8" font-family="monospace" font-size="11">IP &gt; Addresses</text>
  <text x="58" y="158" fill="#94a3b8" font-family="monospace" font-size="11">IP &gt; DHCP</text>
  <text x="58" y="184" fill="#94a3b8" font-family="monospace" font-size="11">IP &gt; Firewall</text>
  <text x="58" y="210" fill="#94a3b8" font-family="monospace" font-size="11">Routing &gt; OSPF</text>
  <text x="58" y="236" fill="#94a3b8" font-family="monospace" font-size="11">Queues (QoS)</text>
  <text x="58" y="262" fill="#94a3b8" font-family="monospace" font-size="11">CLI Terminal</text>

  <!-- Network Topology & Traffic Status -->
  <!-- Status Window -->
  <rect x="165" y="75" width="395" height="110" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1" />
  <text x="180" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Topology: TKJ Gateway &amp; VLAN Distribution</text>
  
  <!-- Interface Table Simulation -->
  <rect x="180" y="112" width="365" height="20" fill="#1e293b" rx="3" />
  <text x="190" y="126" fill="#e2e8f0" font-family="monospace" font-size="10">ether1-WAN [ISP]</text>
  <text x="320" y="126" fill="#10b981" font-family="monospace" font-size="10">R - 1 Gbps Up</text>
  <text x="440" y="126" fill="#38bdf8" font-family="monospace" font-size="10">Tx: 82.4 Mbps</text>

  <rect x="180" y="138" width="365" height="20" fill="#172554" rx="3" />
  <text x="190" y="152" fill="#e2e8f0" font-family="monospace" font-size="10">ether2-LAN [Lab 1]</text>
  <text x="320" y="152" fill="#10b981" font-family="monospace" font-size="10">R - 1 Gbps Up</text>
  <text x="440" y="152" fill="#38bdf8" font-family="monospace" font-size="10">Rx: 94.1 Mbps</text>

  <rect x="180" y="162" width="365" height="18" fill="#1e293b" rx="3" />
  <text x="190" y="175" fill="#e2e8f0" font-family="monospace" font-size="10">vlan10-Hotspot</text>
  <text x="320" y="175" fill="#10b981" font-family="monospace" font-size="10">R - Active</text>
  <text x="440" y="175" fill="#f59e0b" font-family="monospace" font-size="10">Bandwidth Managed</text>

  <!-- CLI Command Terminal Box -->
  <rect x="165" y="196" width="395" height="124" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="180" y="218" fill="#10b981" font-family="monospace" font-size="11">[admin@MikroTik-Tristan] &gt; /ip firewall nat print</text>
  <text x="180" y="238" fill="#94a3b8" font-family="monospace" font-size="10">0   chain=srcnat out-interface=ether1-WAN action=masquerade</text>
  <text x="180" y="258" fill="#10b981" font-family="monospace" font-size="11">[admin@MikroTik-Tristan] &gt; /ping 8.8.8.8 count=3</text>
  <text x="180" y="278" fill="#cbd5e1" font-family="monospace" font-size="10">SENT 3 pkts, RCV 3 pkts, 0% packet loss, min/avg/max = 12/14/17 ms</text>
  <text x="180" y="300" fill="#38bdf8" font-family="monospace" font-size="11">[admin@MikroTik-Tristan] &gt; _</text>
</svg>
